[build-system]
requires = ["setuptools>=64", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "yasbd-eu-packs"
version = "0.1.0"
description = "External Latvian, Hungarian, Croatian, Finnish and Slovenian profiles for yasbd"
readme = "README.md"
requires-python = ">=3.10"
license = "MPL-2.0"
dependencies = ["yasbd-lib>=1.0.0,<2"]

[project.optional-dependencies]
test = ["pytest>=8", "ruff>=0.14", "build"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.ruff]
line-length = 95
target-version = "py310"
